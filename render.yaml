services:
  - type: web
    name: shrom-v4-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shrom-v4-db
          property: connectionString
    healthCheckPath: /health
    plan: free

databases:
  - name: shrom-v4-db
    plan: free
